name: CI/CD

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─── CI: lint + syntax + live e2e against the compose stack ───────────────

jobs:
  ci-backend:
    name: Backend CI
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Import check
        working-directory: backend
        run: SECRET_KEY=ci-secret-key-not-for-production-32ch python -c "import main; print(f'{len(main.app.routes)} routes')"

      - name: Lint
        working-directory: backend
        run: pip install ruff==0.16.6 && ruff check .

  ci-e2e:
    name: E2E (live API)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Start stack (db + backend)
        run: docker compose up -d --build

      - name: Apply migrations
        run: |
          pip install --quiet httpx
          python scripts/migrate.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e2e/requirements.txt

      - name: Install e2e deps
        working-directory: e2e
        run: pip install -r requirements.txt

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health

      - name: Run e2e suite
        working-directory: e2e
        env:
          E2E_API_BASE: http://localhost:8000
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/inventory_db
        run: python -m pytest -q --no-header

      - name: Unit smoke test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/inventory_db
          SECRET_KEY: ci-secret-key-not-for-production-32ch
        run: |
          pip install -q pytest pytest-asyncio httpx
          python -m pytest tests/ -q --no-header

  ci-manage:
    name: Manage script check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax check
        working-directory: ./
        run: python -m py_compile manage.py
      - name: Help renders
        working-directory: ./
        run: python manage.py --help > /dev/null

# ─── CD: images ────────────────────────────────────────────────────────────

  build-docker:
    name: Docker image (tag)
    needs: [ci-backend, ci-e2e, ci-manage]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/vendora-backend

      - name: Build & push backend
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─── Beta image (ghcr.io, :beta tag on every main/master push) ────────────
  beta-docker:
    name: Beta image (ghcr.io)
    needs: [ci-backend, ci-e2e, ci-manage]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image owner
        id: owner
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend (beta)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.owner }}/vendora-backend:beta
