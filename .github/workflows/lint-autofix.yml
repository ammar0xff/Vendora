name: lint-autofix

on:
  workflow_dispatch:

jobs:
  ruff-fix:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ruff
        working-directory: backend
        run: pip install ruff==0.16.6
      - name: Run ruff safe autofix (non-fatal)
        working-directory: backend
        run: ruff check . --fix || true
      - name: Capture remaining-error statistics
        working-directory: backend
        run: |
          ruff check . --statistics 2>&1 | tail -40 || true
          echo "REMSTAT_DONE"
          echo "=== FULL REMAINING (with locations) ==="
          ruff check . --output-format github 2>&1 || true
          echo "REM_LOC_DONE"
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && echo "no changes to commit" || git commit -m "chore: ruff safe autofix (bot)"
          git push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"