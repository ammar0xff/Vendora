# Vendora Beta — run from prebuilt GHCR images (no source build required).
#
#   IMAGE_OWNER=<your-github-username> docker compose -f docker-compose.beta.yml up -d
#
# Images `vendora-backend:beta` / `vendora-frontend:beta` are pushed to
# ghcr.io by the "Beta images (ghcr.io)" job in .github/workflows/build.yml on
# every master/main push. IMAGE_OWNER defaults to `ammar0xff`.
#
# Same demo footprint as docker-compose.demo.yml (db + backend + frontend,
# seeded demo data) but no `build:` contexts — just download and run.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - beta_pgdata:/var/lib/postgresql/data
      - ./data/sql/init_data.sql:/docker-entrypoint-initdb.d/init_data.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  backend:
    image: ghcr.io/${IMAGE_OWNER:-ammar0xff}/vendora-backend:beta
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/inventory_db
      SECRET_KEY: ${SECRET_KEY:-demo-beta-change-this-key-00000000000000000000}
    volumes:
      - beta_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  frontend:
    image: ghcr.io/${IMAGE_OWNER:-ammar0xff}/vendora-frontend:beta
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  beta_pgdata:
  beta_uploads: