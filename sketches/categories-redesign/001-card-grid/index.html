<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>تصنيفات — Card Grid Sketch</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", "Noto Kufi Arabic", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: #f5f6f8;
    color: #111827;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 1px 0 rgba(17,24,39,0.04);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(17,24,39,0.06); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-radius: 12px; font-weight: 700; font-size: 14px;
    border: 1px solid transparent; cursor: pointer;
  }
  .btn-primary { background:#111827; color:#fff; border-color:#111827; }
  .btn-ghost { background:#fff; color:#374151; border-color:#e5e7eb; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; background:#eef2ff; color:#1e3a8f; font-weight:700; font-size:12px; }
  .sub-item { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:12px; background:#f9fafb; border:1px solid #f3f4f6; }
  .empty { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 20px; color:#6b7280; text-align:center; }
  .section-title { font-size: 14px; font-weight: 700; color:#111827; }
  .section-meta { font-size: 12px; color:#6b7280; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .icon-box { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color:#fff; font-weight: 800; }
  .divider { height: 1px; background:#e5e7eb; margin: 12px 0; }
</style>
</head>
<body>
  <div class="max-w-5xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl font-bold">الإعدادات</h1>
        <p class="text-sm text-gray-500 mt-1">إدارة الفئات والتصنيفات</p>
      </div>
      <button class="btn btn-primary" onclick="openModal()">＋ فئة جديدة</button>
    </div>
    <div id="empty" class="empty hidden">
      <span class="text-3xl mb-2">🏷️</span>
      <p class="mt-2 font-semibold">لا توجد فئات</p>
      <p class="text-sm mt-1">اضغط "فئة جديدة" لإنشاء أول فئة</p>
    </div>
    <div id="grid" class="grid"></div>
  </div>
  <div id="modal" class="fixed inset-0 bg-black/20 backdrop-blur-sm hidden place-items-center">
    <div class="bg-white rounded-2xl p-5 w-full max-w-md border border-gray-200 shadow-xl">
      <div class="section-title mb-1">إضافة فئة جديدة</div>
      <p class="section-meta mb-4">أدخل اسم الفئة واضغط إضافة</p>
      <input id="catName" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm" placeholder="اكتب اسم الفئة..." />
      <div class="flex justify-end gap-2 mt-4">
        <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
        <button class="btn btn-primary" onclick="addCategory()">إضافة</button>
      </div>
    </div>
  </div>
  <script>
    const demo = [
      { id: '1', name: 'الإلكترونيات', subs: ['هواتف','لابتوب','سماعات'], color: '#0f172a' },
      { id: '2', name: 'الأثاث', subs: ['طاولات','كراسي','خزائن'], color: '#2a4858' },
      { id: '3', name: 'الملابس', subs: ['رجالي','نسائي','أطفال'], color: '#1e3a5f' },
      { id: '4', name: 'الكتب', subs: ['روايات','علمي','تقني'], color: '#3b1f2b' },
      { id: '5', name: 'المطابع', subs: ['بطاقات','فواتير'], color: '#1f3b2a' },
      { id: '6', name: 'التغليف', subs: ['كراتين','أكياس','أغلفة'], color: '#2b1f3b' },
    ];
    const grid = document.getElementById('grid');
    const empty = document.getElementById('empty');
    function render(){
      grid.innerHTML = '';
      if(!demo.length){ empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      demo.forEach(c => {
        const el = document.createElement('div');
        el.className = 'card';
        el.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="icon-box" style="background:${c.color}">🏷️</div>
              <div>
                <div class="section-title">${c.name}</div>
                <div class="section-meta mt-0.5">${c.subs.length} تصنيف فرعي</div>
              </div>
            </div>
            <div class="flex items-center gap-2">
              <button class="btn btn-ghost" style="padding:8px 10px" onclick="alert('تعديل ${c.name}')">تعديل</button>
              <button class="btn btn-ghost" style="padding:8px 10px; color:#ef4444; border-color:#fee2e2; background:#fff1f2" onclick="confirmDelete('${c.name}', '${c.subs.length}')">حذف</button>
            </div>
          </div>
          <div class="divider"></div>
          <div class="flex flex-wrap gap-2">
            ${c.subs.map(s => `<span class="pill">${s}</span>`).join('')}
            <button class="btn btn-ghost" style="padding:6px 10px" onclick="addSub('${c.id}')">＋ إضافة</button>
          </div>
        `;
        grid.appendChild(el);
      });
    }
    function openModal(){ document.getElementById('modal').classList.remove('hidden'); document.getElementById('modal').classList.add('grid'); }
    function closeModal(){ document.getElementById('modal').classList.add('hidden'); document.getElementById('modal').classList.remove('grid'); }
    function addCategory(){ const v = document.getElementById('catName').value.trim(); if(v){ demo.unshift({id: Date.now().toString(), name:v, subs:[], color:'#1f2937'}); render(); closeModal(); document.getElementById('catName').value=''; } }
    function addSub(cid){ const v = prompt('اسم التصنيف الفرعي'); if(!v) return; const c = demo.find(x=>x.id===cid); if(c){ c.subs.push(v); render(); } }
    function confirmDelete(name, count){ if(confirm('حذف "'+name+'" وكل تصنيفاتها الفرعية ('+count+')؟')){ const i = demo.findIndex(x=>x.name===name); if(i>-1){ demo.splice(i,1); render(); } } }
    render();
  </script>
</body>
</html>
